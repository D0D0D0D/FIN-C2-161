[project]
name = "fin-c2-161"
version = "1.0.0"
description = "AMLDispositionMemoAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# supplied by the platform's own package registry at build time. Pinning it here
# would make `pip install -e .` fail because it is not resolvable from the
# default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

# Lint violations inherited from the distributed scaffold seed. CI runs no lint job,
# so these are suppressed per-file to keep `ruff check src tests` green without editing
# files that must stay byte-identical to the scaffold master (re-sync safety).
# Files rewritten in MR-B drop their entry once the seed code is replaced.
[tool.ruff.lint.per-file-ignores]
"src/graph/graph.py" = ["F401"]                              # seed re-exports InitializeNode/FinalizeNode
"tests/unit/test_main_node.py" = ["F401"]                    # seed imports pytest without using it
"tests/proof_of_boundary/test_import_isolation.py" = ["F541"]  # scaffold-provided PB test — keep byte-identical
"tests/proof_of_boundary/test_state_safety.py" = ["F541"]      # scaffold-provided PB test — keep byte-identical

[tool.mypy]
python_version = "3.11"
strict = true
